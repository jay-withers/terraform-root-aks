# Platform-owned routes: the HTTPS redirect every hostname gets, and Grafana.
# Tenant routes live with their tenants.
---
# Attached to the plaintext listener only, with no hostnames, so it catches
# everything arriving on port 80 regardless of which tenant it was meant for.
# Without this the http listener would quietly serve tenants over plaintext; with
# it, nothing does.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: internal
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: internal
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - grafana.apps.internal
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
