# cert-manager. The issuers it serves are in ../configs — this file installs only
# the controller and its CRDs, so that a ClusterIssuer is never applied against an
# API server that has not registered the kind yet.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  releaseName: cert-manager
  targetNamespace: cert-manager
  # Helm's release state lives with the release rather than in flux-system, so
  # `helm list -n cert-manager` from the jump box shows what is actually installed.
  storageNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Helm does not upgrade CRDs installed as part of a release; cert-manager's
    # chart handles its own, and keep: true means an accidental uninstall does not
    # take every Certificate in the cluster with it.
    crds:
      enabled: true
      keep: true

    # No tolerations, so these land on the apps pool — the system pool is tainted
    # CriticalAddonsOnly and the monitoring pool is reserved for the observability
    # stack.
    replicaCount: 1

    resources:
      requests:
        cpu: 10m
        memory: 64Mi

    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi

    prometheus:
      enabled: true
      servicemonitor:
        # kube-prometheus-stack owns the ServiceMonitor CRD and installs after this
        # one on a cold cluster. Left off so the install cannot fail on a kind the
        # API server has not registered; turn it on once monitoring is established.
        enabled: false
