# The values only Terraform knows, carried into the cluster so that the
# Kustomizations declared in git can reach them.
#
# This is the *only* file in the bootstrap tree that may contain a `${` — Terraform
# substitutes into everything the bootstrap Kustomization builds, and a placeholder
# it has no value for is replaced with an empty string rather than failing. Keeping
# them confined here is what makes the rest of the tree safe to write literally.
# The definitive list of what may appear below is local.flux_post_build_substitutions
# in terraform/locals.tf.
#
# Child Kustomizations inherit none of Terraform's substitution, so they read this
# ConfigMap with postBuild.substituteFrom instead. It lives in flux-system because
# that is where those Kustomizations live, and enforced multi-tenancy will not let a
# Kustomization read a ConfigMap in another namespace.
#
# Nothing here is a secret. A client ID names an identity; it does not authenticate
# as one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  CLUSTER_ENVIRONMENT: ${CLUSTER_ENVIRONMENT}
  CLUSTER_NAME: ${CLUSTER_NAME}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID}
  AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID}
  AZURE_RESOURCE_GROUP: ${AZURE_RESOURCE_GROUP}
  GATEWAY_INTERNAL_IP: ${GATEWAY_INTERNAL_IP}
  WORKLOAD_KEY_VAULT_NAME: ${WORKLOAD_KEY_VAULT_NAME}
  # Environment-scoped — dev.apps.internal, not apps.internal. Every published
  # hostname is built from it rather than written out, so nothing in the tree
  # carries a name that is right in one cluster and wrong in the other two.
  APPS_DNS_ZONE_NAME: ${APPS_DNS_ZONE_NAME}
  EXTERNAL_DNS_CLIENT_ID: ${EXTERNAL_DNS_CLIENT_ID}
  # Loki's log store. The account name carries a random suffix because the blob
  # namespace is global, so unlike every other name here it cannot be derived from
  # workload and environment — it has to be carried.
  LOKI_STORAGE_ACCOUNT: ${LOKI_STORAGE_ACCOUNT}
  LOKI_CHUNKS_CONTAINER: ${LOKI_CHUNKS_CONTAINER}
  LOKI_RULER_CONTAINER: ${LOKI_RULER_CONTAINER}
  LOKI_CLIENT_ID: ${LOKI_CLIENT_ID}
  # The only bound on the blob bill: Loki's own default is to keep every chunk
  # forever. Per environment, from var.loki_retention_days.
  #
  # Carries Loki's duration literal — "14d" — rather than the number, and that is
  # load-bearing rather than cosmetic. A ConfigMap's data values must be strings,
  # and quoting here does not survive: kustomize re-emits a string that does not
  # need quotes without them, so a bare `14` reaches the API server as a number
  # and invalidates this whole ConfigMap, taking every other variable down with it.
  LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD}
  WHOAMI_CLIENT_ID: ${WHOAMI_CLIENT_ID}
