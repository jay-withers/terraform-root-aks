# The tenant's own workload. Everything in this directory is reconciled by the
# whoami Kustomization impersonating the whoami-reconciler service account, so it
# can only ever create namespaced objects here — a ClusterRole or a Namespace
# committed to this tree is refused, by design.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: tenant-whoami
  labels:
    app.kubernetes.io/name: whoami
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
        # Without this label the workload identity webhook does not mutate the pod,
        # no token is projected, and the CSI mount fails with an authentication
        # error that says nothing about a missing label. It is the single easiest
        # thing to leave out of a working set of manifests.
        azure.workload.identity/use: "true"
    spec:
      # The account the federated credential in Azure names. A pod that runs as
      # `default` gets no Azure token no matter how the identity is configured.
      serviceAccountName: whoami
      # Spread across nodes so a single node's loss does not take the service with
      # it. ScheduleAnyway rather than DoNotSchedule: dev runs one node in the apps
      # pool, where a hard constraint would leave the second replica Pending
      # forever.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: whoami
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          args:
            - --port=8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Proves the Key Vault path end to end. Read it with
            #   kubectl exec -n tenant-whoami deploy/whoami -- cat /mnt/secrets-store/whoami-demo
            # The mount is what triggers the fetch, so a pod that does not mount it
            # never authenticates to Azure at all.
            - name: keyvault
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
      volumes:
        - name: keyvault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              # The SecretProviderClass is platform-owned and lives in
              # gitops/tenants/onboarding/ — the tenant may mount it, not rewrite it.
              secretProviderClass: whoami-keyvault
