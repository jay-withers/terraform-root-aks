apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: tenant-whoami
  labels:
    app.kubernetes.io/name: whoami
spec:
  # ClusterIP, never LoadBalancer. A LoadBalancer Service here would ask AKS for a
  # public IP and publish this cluster to the internet; the shared internal Gateway
  # is the only front door, and it already has an address.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
