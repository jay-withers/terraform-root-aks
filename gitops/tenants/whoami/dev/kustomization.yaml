# whoami on the dev cluster — the base as-is, two replicas. Not one, even on a
# single node: dev is where node upgrades are tested for zero downtime, and with a
# single replica the PodDisruptionBudget in the base can never be satisfied, so the
# drain blocks instead of moving the pod. Both replicas share the one node until a
# surge node appears; the spread constraint in the base is ScheduleAnyway, so that
# is allowed rather than leaving one Pending.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
