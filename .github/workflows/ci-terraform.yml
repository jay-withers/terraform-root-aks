name: ci-terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Credential-free init + validate of terraform/, via the shared workflow.
  # The path filter and the always-reporting gate job both live in there — mark
  # "terraform / Terraform" as the required check in the ruleset.
  #
  # There is no plan job: a plan here only succeeds once the landing zone
  # exists (the resource group, the hub VNet and the hub's private DNS zone are
  # all looked up, and a data source for something not yet created fails at
  # plan time). The real plan is cd-terraform's, on merge, in the
  # `terraform-pending` issue.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    uses: jay-withers/workflows/.github/workflows/terraform.yml@097b8b97138b3af033cab166dd31e84deccf8f9d # v1.24.11
