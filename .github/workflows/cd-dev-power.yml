name: cd-dev-power

# Runs the dev cluster 12:00–22:00 UK time and stops it the rest of the day. A
# stopped cluster bills nothing for node compute; the disks, load balancers and
# private endpoints carry on, which is the floor this cannot go below.
#
# GitHub's cron is UTC-only and the UK is not, and scheduled runs are routinely
# hours late or dropped outright (observed: 4–9 hours late, about half never ran).
# So a run acts whenever London time is inside its action's window — a start run
# anywhere in 12:00–22:00, a stop run anywhere in 22:00–12:00 — not only in the
# boundary hour. Each boundary is scheduled three times, covering both UTC
# offsets with a retry, at :23 rather than :00 because top-of-the-hour schedules
# are the ones GitHub delays most. A run that lands outside its window (the GMT
# run an hour early, or one so late the other boundary has passed) is a no-op,
# and start/stop are no-ops when the cluster is already there.
#
# The retries mean a manual override near a boundary may be undone: a cluster
# started by hand just after 22:00 can be stopped by a later stop run, and one
# stopped by hand just after 12:00 restarted. Away from the boundaries it stays
# as left until the next one. workflow_dispatch does either by hand.
#
# Authenticates as the landing zone's vended identity (uai-aks-dev) in the `dev`
# environment, through its `environment-dev` federated credential, the same login
# cd-terraform uses. github-repos sets the environment's AZURE_* variables.
# Contributor on the resource group covers start and stop. The repository-level
# AZURE_* variables it used to read named an identity that had since been
# recreated, so every run failed with AADSTS700016.

on:
  schedule:
    - cron: "23 11,12,13 * * *" # start: 12:00 London
    - cron: "23 21,22,23 * * *" # stop: 22:00 London
  workflow_dispatch:
    inputs:
      action:
        description: Start or stop the dev cluster now
        type: choice
        options: [start, stop]
        required: true

permissions:
  contents: read

# Never two at once: a start and a stop racing would leave whichever lost failing
# with an operation-in-progress conflict.
concurrency:
  group: cd-dev-power
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-aks-dev
  CLUSTER_NAME: aks-aks-dev
  START_HOUR: "12"
  STOP_HOUR: "22"

jobs:
  power:
    # No `if: vars.AZURE_CLIENT_ID != ''` gate: a job-level `if` is evaluated
    # before the job enters its environment, so it would read empty and skip
    # every run.
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Decide
        id: decide
        env:
          DISPATCHED: ${{ inputs.action }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$DISPATCHED" ]; then
            echo "action=$DISPATCHED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 10# because %H is zero-padded and 08/09 are invalid octal.
          hour=$((10#$(TZ=Europe/London date +%H)))
          if [ "$hour" -ge "$START_HOUR" ] && [ "$hour" -lt "$STOP_HOUR" ]; then
            window=start
          else
            window=stop
          fi

          case "$SCHEDULE" in
            "23 11,12,13 * * *") want=start ;;
            "23 21,22,23 * * *") want=stop ;;
            *) echo "::error::unrecognised schedule '$SCHEDULE'"; exit 1 ;;
          esac

          if [ "$want" = "$window" ]; then
            echo "action=$want" >> "$GITHUB_OUTPUT"
          else
            echo "London is ${hour}:xx, outside the $want window — early offset run, or so late the other boundary has passed. Nothing to do."
          fi

      - name: Azure login
        if: steps.decide.outputs.action != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start or stop
        if: steps.decide.outputs.action != ''
        env:
          ACTION: ${{ steps.decide.outputs.action }}
        run: |
          state=$(az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER_NAME" --query powerState.code -o tsv)
          case "$ACTION/$state" in
            start/Running | stop/Stopped)
              echo "$CLUSTER_NAME is already $state."
              exit 0
              ;;
          esac

          # Waits for completion, so a stop refused mid-upgrade or mid-apply fails
          # the run visibly rather than being reported as done.
          echo "$CLUSTER_NAME is $state; running az aks $ACTION."
          az aks "$ACTION" -g "$RESOURCE_GROUP" -n "$CLUSTER_NAME"
